[uwsgi]
# Ruta al entorno virtual que crea Poetry dentro de admin
home = /home/grupo32/app/current/admin/.venv

# Directorio donde está tu código (donde se encuentra wsgi.py)
chdir = /home/grupo32/app/current/admin

# Carga el archivo wsgi.py y busca la variable 'app'
module = wsgi:app

master = true
processes = 2
threads = 2
vacuum = true
touch-reload = %(chdir)/uwsgi.ini