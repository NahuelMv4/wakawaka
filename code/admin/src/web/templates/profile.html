{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Mi Perfil</h1>
    
    <div class="card mt-3">
        <div class="card-body">
            <p><strong>Nombre completo:</strong> {{ usuario.nombre }} {{ usuario.apellido }}</p>
            <p><strong>Email:</strong> {{ usuario.email }}</p>
            <p><strong>Fecha de creación:</strong> {{ usuario.creado_en.strftime('%d/%m/%Y') }}</p>
        </div>
    </div>
</div>
{% endblock %}
